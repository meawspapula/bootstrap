<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p31</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">

        <div class="mb-3">
            <label for="courseDatalist" class="form-label">Choose a Course (Datalist):</label>
            <input class="form-control" list="courseOptions" id="courseDatalist" placeholder="Start typing...">
            <datalist id="courseOptions">
                <option value="HTML">
                <option value="CSS">
                <option value="JavaScript">
                <option value="Bootstrap">
                <option value="React">
            </datalist>
        </div>
        <div class="mb-3">
            <label for="selectLevel" class="form-label">Select Level:</label>
            <select class="form-select" id="selectLevel">
                <option selected>Choose level</option>
                <option value="1">Beginner</option>
                <option value="2">Intermediate</option>
                <option value="3">Advanced</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Input Sizes:</label>
            <input type="text" class="form-control form-control-sm mb-2" placeholder="Small input">
            <input type="text" class="form-control mb-2" placeholder="Default input">
            <input type="text" class="form-control form-control-lg" placeholder="Large input">
        </div>

        <button type="submit" class="btn btn-primary">Submit</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
