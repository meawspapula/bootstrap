<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stunning Bootstrap Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Ensuring containers have enough height for vertical alignment demonstration */
        .centered-container {
            min-height: 200px;
        }
        .bottom-container {
            min-height: 150px;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container mt-4">
        <div class="bg-dark text-white p-4 rounded-3 text-center mb-4">
            <h1 class="fw-bold">Stunning Bootstrap Alignment Layout</h1>
        </div>

        <div class="row g-2 mb-4">
            <div class="col-md-4">
                <div class="bg-primary text-white p-4 rounded-3 text-center">Left Box</div>
            </div>
            <div class="col-md-4">
                <div class="bg-warning text-dark p-4 rounded-3 text-center">Middle Box</div>
            </div>
            <div class="col-md-4">
                <div class="bg-danger text-white p-4 rounded-3 text-center">Right Box</div>
            </div>
        </div>

        <div class="bg-info bg-opacity-75 p-5 rounded-3 mb-4 centered-container d-flex justify-content-center align-items-center">
            <div class="bg-white p-4 rounded-4 shadow-sm text-center" style="width: 40%;">
                Centered Both Ways
            </div>
        </div>

        <div class="bg-secondary bg-opacity-50 p-4 rounded-3 bottom-container">
            <div class="row align-items-end h-100">
                <div class="col">
                    <div class="bg-dark text-white p-3 rounded-3 text-center">Bottom Align</div>
                </div>
                <div class="col">
                    <div class="bg-success text-white p-4 rounded-3 text-center">Also Bottom Aligned</div>
                </div>
                <div class="col">
                    <div class="bg-dark text-white p-3 rounded-3 text-center">Bottom Align</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
