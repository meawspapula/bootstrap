<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>3rd project</title>
</head>
<body>
    <div class="container bg-dark text-light w-35 m-2">
        <h1>Advanced Bootstrap Grid Layout</h1>
        <p>This layout changes at 3 different breakpoints</p>
    </div>
    <div class="container2">
        <div class="row">
            <div class="col-3 bg-primary m-3 rounded-4 p-3">Main Box 1</div>
            <div class="col-3 bg-success m-3 rounded-4 p-3">Main Box 2</div>
            <div class="col-3 bg-danger  m-3 rounded-4 p-3">Main Box 3</div>
        </div>

        <div class="row m-2 p-2">
            <div class=" row col-md-7 pb-2 pt-2  bg-warning rounded-4 p-1">
                <h1>Main Content Area</h1>
                <div class="col-3 bg-light m-3 rounded-3 p-3 w-25">Nested 1</div>
                <div class="col-3 bg-info  m-3 rounded-3 p-3 w-25">Nested 2</div>
                <div class="col-3 bg-dark text-light m-3 rounded-3 p-3 w-25">Nested 3</div>
            </div>
           <div class="col-3 bg-primary m-4 rounded-4 p-3 h-25 ms-5">Main Box 1</div>
        </div>
    </div>
</body>
</html>
