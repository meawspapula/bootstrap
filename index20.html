<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p-20</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white">

<div class="container py-5 text-center">
  <h2 class="fw-bold">
    Course Platform 
    <span class="badge bg-success">Live</span>
  </h2>
  <p class="text-muted mb-5">Learn skills with real-time updates</p>
  <div class="row g-4 justify-content-center">
    <div class="col-md-4">
      <div class="card border-0 shadow-sm">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTGv0ZIrLidHrXmxdSY38qwW3_FyQZhJo-sFQ&s" class="card-img-top rounded w-50 mx-auto mt-3">
        <div class="card-body">
          <h5 class="card-title">
            Web Development 
            <span class="badge bg-primary ms-1">New</span>
          </h5>
          <p class="text-muted">
            Students Enrolled 
            <span class="badge bg-info">120</span>
          </p>
          <button class="btn btn-dark">
            Enroll <span class="ms-1 badge bg-light text-dark">4</span>
          </button>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card border-0 shadow-sm">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTGv0ZIrLidHrXmxdSY38qwW3_FyQZhJo-sFQ&s" class="card-img-top rounded w-50 mx-auto mt-3">
        <div class="card-body">
          <h5 class="card-title">
            Networking 
            <span class="badge bg-warning text-dark ms-1">Popular</span>
          </h5>

          <div class="d-flex justify-content-between border rounded p-2 mb-2">
            <span>Modules</span>
            <span class="badge bg-secondary">8</span>
          </div>

          <div class="d-flex justify-content-between border rounded p-2">
            <span>Projects</span>
            <span class="badge bg-success">3</span>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card border-0 shadow-sm">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTGv0ZIrLidHrXmxdSY38qwW3_FyQZhJo-sFQ&s" class="card-img-top rounded w-50 mx-auto mt-3">
        <div class="card-body">
          <h5 class="card-title">
            UI / UX Design 
            <span class="badge bg-danger ms-1">Limited</span>
          </h5>

          <p class="mb-2">
            Status:
            <span class="badge bg-primary">View Details</span>
          </p>

          <button class="btn btn-dark">
            Updated Today
          </button>
        </div>
      </div>
    </div>

  </div>
</div>
</html>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
