<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>checkbox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="form-check">
            <input  class="form-check-input" type="checkbox" id="Development">
            <label class="form-check-label" for="Development">
                Web Development
            </label>
        </div>
        <div class="form-check">
            <input  class="form-check-input" type="checkbox" id="Maintain">
            <label class="form-check-label" for="Maintain">
                Pc Maintainance
            </label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="radioExample" id="g11" value="option1">
            <label class="form-check-label" for="g11">
                Grade 11
            </label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="radioExample" id="g12" value="option2">
            <label class="form-check-label" for="g12">
                Grade 12
            </label>
        </div>

        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="Notification">
            <label class="form-check-label" for="Notification">
                Enable Notification
            </label>
        </div>
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="mode">
            <label class="form-check-label" for="mode">
                Dark Mode
            </label>
        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
